; Load-test mobile push workflow: force the push path for users whose
; preprocess_subroutine is wazo-loadtest-mobile (set by provision-mobile.py).
;
; Runs from [user] via wazo-subroutine, AFTER incoming_user_set_features
; computed WAZO_INTERFACE and BEFORE the wake_mobile AGI and Dial(), so the
; caller ends up parked in wazo-calld's dial_mobile app.
;
; WAZO_INTERFACE is "PJSIP/<aor>" or "PJSIP/<aor>/sip:..." here: the second
; /-separated field is the AOR name.
;
; Install: copy to /etc/asterisk/extensions_extra.d/ then "dialplan reload"

[wazo-loadtest-mobile]
exten = s,1,Set(WAZO_INTERFACE=Local/${CUT(WAZO_INTERFACE,/,2)}@wazo_wait_for_registration)
same  =   n,Set(WAZO_WAIT_FOR_MOBILE=1)
same  =   n,Return()
