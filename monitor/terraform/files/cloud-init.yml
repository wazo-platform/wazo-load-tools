#cloud-config
# nofail is required: the EBS volume may not be attached yet at boot time.
# runcmd waits for the device and calls mount -a to complete the mount.
mounts:
  - [ /dev/sdb, /mnt/prometheus, auto, "defaults,nofail" ]

runcmd:
  - echo 'Waiting for Prometheus EBS volume to be attached...'
  - while [ ! -b /dev/sdb ]; do sleep 2; done
  - echo 'Formating volume if needed...'
  - lsblk -n -o FSTYPE /dev/sdb | grep -q ext4 || mkfs.ext4 -L prometheus /dev/sdb

  - echo 'Fix mount permissions...'
  - mkdir /mnt/prometheus
  - mount -a
  - chmod 777 /mnt/prometheus

  - echo 'Installing docker...'
  - apt-get update
  - apt-get install -y ca-certificates curl gnupg
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - chmod a+r /etc/apt/keyrings/docker.gpg
  - echo "deb [arch="$(dpkg --print-architecture)" signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian "$(. /etc/os-release && echo "$VERSION_CODENAME")" stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - groupadd -f docker
  - usermod -aG docker ${user}

  - echo 'Installing gcx...'
  - curl -fSL "https://github.com/grafana/gcx/releases/download/v1.3.0/gcx_1.3.0_linux_amd64.tar.gz" | tar -xz -C /usr/local/bin gcx
  - chmod a+x "/usr/local/bin/gcx"
