apiVersion: dashboard.grafana.app/v0alpha1
kind: Dashboard
metadata:
  annotations:
    grafana.app/folder: load
  labels: {}
  name: load-runs
  namespace: default
spec:
  annotations:
    list: []
  description: The load runs of the time range, each on the window of its stack's life
  editable: true
  fiscalYearStartMonth: 0
  graphTooltip: 0
  links:
  - asDropdown: true
    icon: external link
    includeVars: true
    keepTime: true
    tags:
    - load-run
    targetBlank: false
    title: Load run
    type: dashboards
  panels:
  - datasource:
      type: prometheus
      uid: ${DS_PROMETHEUS}
    description: One row per testid, from the first to the last scrape of its stack; the testid opens it on that window
    fieldConfig:
      defaults:
        custom:
          align: auto
          cellOptions:
            type: auto
          inspect: false
      overrides:
      - matcher:
          id: byName
          options: testid
        properties:
        - id: links
          value:
          - title: Open the run
            url: /d/xhAP-wazo-flask-services?from=${__data.fields.from}&to=${__data.fields.to}&var-testid=${__value.text}&var-instance=ephemeral
      - matcher:
          id: byName
          options: Start
        properties:
        - id: unit
          value: dateTimeAsLocal
      - matcher:
          id: byName
          options: End
        properties:
        - id: unit
          value: dateTimeAsLocal
      - matcher:
          id: byName
          options: Duration
        properties:
        - id: unit
          value: s
      - matcher:
          id: byRegexp
          options: ^(from|to)$
        properties:
        - id: unit
          value: none
        - id: decimals
          value: 0
        - id: custom.hideFrom.viz
          value: true
    gridPos:
      h: 20
      w: 24
      x: 0
      y: 0
    id: 1
    options:
      cellHeight: sm
      showHeader: true
      sortBy:
      - desc: true
        displayName: Start
    targets:
    - datasource:
        type: prometheus
        uid: ${DS_PROMETHEUS}
      expr: min by (testid, profile) (min_over_time(timestamp(up{job="node",testid!=""})[$__range:1m])) * 1000
      format: table
      instant: true
      refId: A
    - datasource:
        type: prometheus
        uid: ${DS_PROMETHEUS}
      expr: max by (testid, profile) (max_over_time(timestamp(up{job="node",testid!=""})[$__range:1m])) * 1000
      format: table
      instant: true
      refId: B
    - datasource:
        type: prometheus
        uid: ${DS_PROMETHEUS}
      expr: >-
        max by (testid, profile) (max_over_time(timestamp(up{job="node",testid!=""})[$__range:1m]))
        - min by (testid, profile) (min_over_time(timestamp(up{job="node",testid!=""})[$__range:1m]))
      format: table
      instant: true
      refId: C
    - datasource:
        type: prometheus
        uid: ${DS_PROMETHEUS}
      expr: min by (testid, profile) (min_over_time(timestamp(up{job="node",testid!=""})[$__range:1m])) * 1000
      format: table
      instant: true
      refId: D
    - datasource:
        type: prometheus
        uid: ${DS_PROMETHEUS}
      expr: max by (testid, profile) (max_over_time(timestamp(up{job="node",testid!=""})[$__range:1m])) * 1000
      format: table
      instant: true
      refId: E
    title: Load runs
    transformations:
    - id: merge
      options: {}
    - id: organize
      options:
        excludeByName:
          Time: true
        indexByName:
          testid: 0
          profile: 1
          'Value #A': 2
          'Value #B': 3
          'Value #C': 4
          'Value #D': 5
          'Value #E': 6
        renameByName:
          'Value #A': Start
          'Value #B': End
          'Value #C': Duration
          'Value #D': from
          'Value #E': to
    type: table
  refresh: ""
  schemaVersion: 39
  tags:
  - k6
  - load-run
  templating:
    list:
    - current:
        text: prometheus
        value: ${DS_PROMETHEUS}
      hide: 0
      includeAll: false
      label: Prometheus DS
      multi: false
      name: DS_PROMETHEUS
      options: []
      query: prometheus
      refresh: 1
      regex: ""
      type: datasource
  time:
    from: now-7d
    to: now
  timepicker: {}
  timezone: ""
  title: Load runs
  weekStart: ""
