rule_files:
    - ../alerts/continuous.yml

evaluation_interval: 1m

# NOTE:
# - Avoid to use ambiguous short syntax (1x10) for values
#   ex: 1x10 will produce 11 values
# - <metric>[10m] is left-open, i.e. samples with timestamps coinciding with
#   the left boundary of the range are excluded. That's why dummy series must
#   have interval less than 10m

tests:
  - name: when memory firing more than 10m
    interval: 1m
    input_series:
      - series: 'node_memory_MemAvailable_bytes{instance="stack:6387", target="stack", load="continuous"}'
        values: '2+0x10'
      - series: 'node_memory_MemTotal_bytes{instance="stack:6387", target="stack", load="continuous"}'
        values: '100+0x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: CriticalRAMUsage
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: stack:6387
              target: stack
              load: continuous
            exp_annotations:
              summary: 'Memory usage has been above 90% for more than 10 minutes'
              description: 'Instance **stack:6387**'

  - name: when memory firing less than 10m
    interval: 1m
    input_series:
      - series: 'node_memory_MemAvailable_bytes{instance="stack:6387", target="stack", load="continuous"}'
        values: '30+0x8 2 2'
      - series: 'node_memory_MemTotal_bytes{instance="stack:6387", target="stack", load="continuous"}'
        values: '100+0x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: CriticalRAMUsage
        exp_alerts: []

  - name: when memory firing on a stack not under continuous load
    interval: 1m
    input_series:
      - series: 'node_memory_MemAvailable_bytes{instance="stack:6387"}'
        values: '2+0x10'
      - series: 'node_memory_MemTotal_bytes{instance="stack:6387"}'
        values: '100+0x10'
      - series: 'node_memory_MemAvailable_bytes{instance="ephemeral", load="ephemeral"}'
        values: '2+0x10'
      - series: 'node_memory_MemTotal_bytes{instance="ephemeral", load="ephemeral"}'
        values: '100+0x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: CriticalRAMUsage
        exp_alerts: []

  - name: when cpu load average firing more than 10m
    interval: 1m
    input_series:
      - series: 'node_cpu_seconds_total{instance="stack:6387", target="stack", load="continuous", mode="idle"}'
        values: '0+2x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: CriticalCPULoad
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: stack:6387
              target: stack
              load: continuous
            exp_annotations:
              summary: "CPU load average has been above 96% for more than 10 minutes"
              description: 'Instance **stack:6387**'

  - name: when cpu load average firing less than 10m
    interval: 1m
    input_series:
      - series: 'node_cpu_seconds_total{instance="stack:6387", target="stack", load="continuous", mode="idle"}'
        values: '0+4x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: CriticalCPULoad
        exp_alerts: []

  - name: memory growing day over day
    interval: 5m
    input_series:
      # 500MiB, then 20MiB/h: 1747627 per 5m
      - series: 'namedprocess_namegroup_memory_bytes{groupname="postgres", instance="stack:6387", target="stack", load="continuous", memtype="proportionalResident"}'
        values: '524288000+1747627x900'
      - series: 'namedprocess_namegroup_oldest_start_time_seconds{groupname="postgres", instance="stack:6387", target="stack", load="continuous"}'
        values: '0+0x900'
    alert_rule_test:
      - eval_time: 48h
        alertname: MemoryLeak
        exp_alerts: []
      - eval_time: 50h
        alertname: MemoryLeak
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: stack:6387
              target: stack
              load: continuous
              groupname: postgres
              memtype: proportionalResident
            exp_annotations:
              summary: "Memory usage has grown by more than 100MiB and 20% in a day"
              description: "Instance **stack:6387**, Service postgres, +480MiB in a day, now 1.465GiB"

  - name: memory warming up then steady
    interval: 5m
    input_series:
      # 1GiB in the first 12h: 7456540 per 5m
      - series: 'namedprocess_namegroup_memory_bytes{groupname="postgres", instance="stack:6387", target="stack", load="continuous", memtype="proportionalResident"}'
        values: '0+7456540x144 1073741760+0x756'
      - series: 'namedprocess_namegroup_oldest_start_time_seconds{groupname="postgres", instance="stack:6387", target="stack", load="continuous"}'
        values: '0+0x900'
    alert_rule_test:
      # a day after the start, the day before is still warming up
      - eval_time: 30h
        alertname: MemoryLeak
        exp_alerts: []
      - eval_time: 50h
        alertname: MemoryLeak
        exp_alerts: []
      - eval_time: 70h
        alertname: MemoryLeak
        exp_alerts: []

  - name: memory growing in a process younger than 2 days
    interval: 5m
    input_series:
      - series: 'namedprocess_namegroup_memory_bytes{groupname="postgres", instance="stack:6387", target="stack", load="continuous", memtype="proportionalResident"}'
        values: '524288000+1747627x900'
      # restarted at 48h
      - series: 'namedprocess_namegroup_oldest_start_time_seconds{groupname="postgres", instance="stack:6387", target="stack", load="continuous"}'
        values: '172800+0x900'
    alert_rule_test:
      - eval_time: 60h
        alertname: MemoryLeak
        exp_alerts: []

  - name: memory growing by less than 20% in a day
    interval: 5m
    input_series:
      # 10GiB, then 150MiB a day: 546133 per 5m
      - series: 'namedprocess_namegroup_memory_bytes{groupname="postgres", instance="stack:6387", target="stack", load="continuous", memtype="proportionalResident"}'
        values: '10737418240+546133x900'
      - series: 'namedprocess_namegroup_oldest_start_time_seconds{groupname="postgres", instance="stack:6387", target="stack", load="continuous"}'
        values: '0+0x900'
    alert_rule_test:
      - eval_time: 60h
        alertname: MemoryLeak
        exp_alerts: []

  - name: simultaneous calls
    interval: 1m
    input_series:
      # peak of 35 expected calls: 35 + 3 * sqrt(35) = 52.7
      - series: 'asterisk_calls_count{instance="stack:6387", target="stack", load="continuous"}'
        values: '0+0x9 60+0x9'
      - series: 'k6_expected_calls{testid="stack-1", target="stack", load="continuous"}'
        values: '35+0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: AsteriskSimultCalls
        exp_alerts: []
      - eval_time: 20m
        alertname: AsteriskSimultCalls
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: stack:6387
              target: stack
              load: continuous
            exp_annotations:
              summary: 'Simultaneous calls are higher than the expected peak'
              description: 'Instance **stack:6387**, Calls 60, 35 expected on average'

  - name: simultaneous calls above the average but below the peak
    interval: 1m
    input_series:
      - series: 'asterisk_calls_count{instance="stack:6387", target="stack", load="continuous"}'
        values: '42+0x20'
      - series: 'k6_expected_calls{testid="stack-1", target="stack", load="continuous"}'
        values: '35+0x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: AsteriskSimultCalls
        exp_alerts: []

  - name: simultaneous calls expected for another target
    interval: 1m
    input_series:
      - series: 'asterisk_calls_count{instance="stack:6387", target="stack", load="continuous"}'
        values: '60+0x20'
      - series: 'k6_expected_calls{testid="other-1", target="other", load="continuous"}'
        values: '35+0x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: AsteriskSimultCalls
        exp_alerts: []

  - name: total calls
    interval: 1m
    input_series:
      - series: 'asterisk_calls_sum{instance="stack:6387", target="stack", load="continuous"}'
        values: '0+1x10 10+0x9'
    alert_rule_test:
      - eval_time: 10m
        alertname: AsteriskTotalCalls
        exp_alerts: []
      - eval_time: 20m
        alertname: AsteriskTotalCalls
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: stack:6387
              target: stack
              load: continuous
            exp_annotations:
              summary: 'Total calls are not increasing'
              description: 'Instance **stack:6387**'

  - name: total calls when reset
    interval: 1m
    input_series:
      - series: 'asterisk_calls_sum{instance="stack:6387", target="stack", load="continuous"}'
        values: '0+1x10 0 0 0+1x7'
    alert_rule_test:
      - eval_time: 20m
        alertname: AsteriskTotalCalls
        exp_alerts: []

  - name: postgres connections
    interval: 1m
    input_series:
      - series: 'pg_stat_activity_count{instance="stack:6387", target="stack", load="continuous"}'
        values: '50+0x9 91+0x10'
      - series: 'pg_settings_max_connections{instance="stack:6387", target="stack", load="continuous"}'
        values: '100+0x19'
    alert_rule_test:
      - eval_time: 10m
        alertname: PGConnectionUsage
        exp_alerts: []
      - eval_time: 20m
        alertname: PGConnectionUsage
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: stack:6387
              target: stack
              load: continuous
            exp_annotations:
              summary: 'PostgreSQL connections usage has been above 90% for more than 10 minutes'
              description: 'Instance **stack:6387**'

  - name: file descriptors
    interval: 1m
    input_series:
      - series: 'namedprocess_namegroup_worst_fd_ratio{groupname="wazo-calld", instance="stack:6387", target="stack", load="continuous"}'
        values: '0.5+0x4 0.95+0x5'
      - series: 'namedprocess_namegroup_worst_fd_ratio{groupname="asterisk", instance="stack:6387", target="stack", load="continuous"}'
        values: '0.05+0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: FileDescriptorsUsage
        exp_alerts: []
      - eval_time: 10m
        alertname: FileDescriptorsUsage
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: stack:6387
              target: stack
              load: continuous
              groupname: wazo-calld
            exp_annotations:
              summary: "File descriptors usage has been above 90% for more than 5 minutes"
              description: "Instance **stack:6387**, Service wazo-calld, 95%"

  - name: calls not answered
    interval: 1m
    input_series:
      - series: 'k6_sip_calls_total{testid="stack-1", target="stack", load="continuous", answered="true"}'
        values: '0+54x20'
      - series: 'k6_sip_calls_total{testid="stack-1", target="stack", load="continuous", answered="false"}'
        values: '0+6x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: CallsNotAnswered
        exp_alerts:
          - exp_labels:
              severity: critical
              testid: stack-1
              target: stack
              load: continuous
            exp_annotations:
              summary: "More than 5% of calls have not been answered for more than 10 minutes"
              description: "Run **stack-1**, 10% not answered"

  - name: calls not answered below the threshold
    interval: 1m
    input_series:
      - series: 'k6_sip_calls_total{testid="stack-1", target="stack", load="continuous", answered="true"}'
        values: '0+99x20'
      - series: 'k6_sip_calls_total{testid="stack-1", target="stack", load="continuous", answered="false"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: CallsNotAnswered
        exp_alerts: []

  - name: calls not answered on a run not under continuous load
    interval: 1m
    input_series:
      - series: 'k6_sip_calls_total{testid="run-1", answered="true"}'
        values: '0+54x20'
      - series: 'k6_sip_calls_total{testid="run-1", answered="false"}'
        values: '0+6x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: CallsNotAnswered
        exp_alerts: []

  - name: load not running
    interval: 1m
    input_series:
      - series: 'up{job="asterisk", instance="stack:6387", target="stack", load="continuous"}'
        values: '1+0x20'
      - series: 'up{job="node", instance="stack:6387", target="stack", load="continuous"}'
        values: '1+0x20'
      - series: 'k6_expected_calls{testid="stack-1", target="stack", load="continuous"}'
        values: '35+0x4'
    alert_rule_test:
      - eval_time: 5m
        alertname: LoadNotRunning
        exp_alerts: []
      - eval_time: 20m
        alertname: LoadNotRunning
        exp_alerts:
          - exp_labels:
              severity: critical
              target: stack
              load: continuous
            exp_annotations:
              summary: "Continuous load has not been running for more than 10 minutes"
              description: "Target **stack**"

  - name: load running
    interval: 1m
    input_series:
      - series: 'up{job="asterisk", instance="stack:6387", target="stack", load="continuous"}'
        values: '1+0x20'
      - series: 'k6_expected_calls{testid="stack-1", target="stack", load="continuous"}'
        values: '35+0x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: LoadNotRunning
        exp_alerts: []

  - name: load running for another target
    interval: 1m
    input_series:
      - series: 'up{job="asterisk", instance="stack:6387", target="stack", load="continuous"}'
        values: '1+0x20'
      - series: 'k6_expected_calls{testid="other-1", target="other", load="continuous"}'
        values: '35+0x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: LoadNotRunning
        exp_alerts:
          - exp_labels:
              severity: critical
              target: stack
              load: continuous
            exp_annotations:
              summary: "Continuous load has not been running for more than 10 minutes"
              description: "Target **stack**"

  - name: target down
    interval: 1m
    input_series:
      - series: 'up{job="asterisk", instance="stack:6387", target="stack", load="continuous"}'
        values: '1+0x4 0+0x15'
    alert_rule_test:
      - eval_time: 15m
        alertname: TargetDown
        exp_alerts: []
      - eval_time: 20m
        alertname: TargetDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: asterisk
              instance: stack:6387
              target: stack
              load: continuous
            exp_annotations:
              summary: "Target has not been scraped for more than 15 minutes"
              description: "Instance **stack:6387**, Job asterisk"
