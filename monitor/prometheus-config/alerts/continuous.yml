# NOTE:
# - ${value}: result from the last evaluation of the "for"
# - Aggregations keep `load`, which Alertmanager routes on, and `target`, which
#   stopping a continuous load silences
# - k6 series carry no `instance`: join them with a host's series on `target`

groups:
- name: Continuous Load Rules
  rules:
  - alert: MemoryLeak
    # Under load, memory keeps warming up for more than half a day: compare a
    # day with the one before, once both are past the start. Proportional memory
    # counts the pages a group's processes share only once.
    expr: >-
      (
        namedprocess_namegroup_memory_bytes{memtype="proportionalResident", load="continuous"}
        - namedprocess_namegroup_memory_bytes{memtype="proportionalResident", load="continuous"} offset 1d
        > 100 * 2^20
      )
      and
      (
        namedprocess_namegroup_memory_bytes{memtype="proportionalResident", load="continuous"}
        > 1.2 * namedprocess_namegroup_memory_bytes{memtype="proportionalResident", load="continuous"} offset 1d
      )
      and on(instance, groupname)
      (time() - namedprocess_namegroup_oldest_start_time_seconds{load="continuous"}) > 2 * 86400
    for: 1h
    labels:
      severity: warning
    annotations:
      summary: "Memory usage has grown by more than 100MiB and 20% in a day"
      description: >-
        Instance **{{ $labels.instance }}**,
        Service {{ $labels.groupname }},
        +{{ $value | humanize1024 }}B in a day,
        now {{ with printf "namedprocess_namegroup_memory_bytes{instance='%s',memtype='proportionalResident',groupname='%s'}" .Labels.instance .Labels.groupname | query }}{{ . | first | value | humanize1024 }}{{ end }}B

  - alert: CriticalRAMUsage
    expr: (1 - node_memory_MemAvailable_bytes{load="continuous"} / node_memory_MemTotal_bytes) * 100 > 90
    for: 10m
    labels:
      severity: critical
    annotations:
      summary: "Memory usage has been above 90% for more than 10 minutes"
      description: "Instance **{{ $labels.instance }}**"

  - alert: DiskWillFillUp
    expr: predict_linear(node_filesystem_avail_bytes{mountpoint="/", load="continuous"}[6h], 86400) < 0
    for: 1h
    labels:
      severity: warning
    annotations:
      summary: "Root disk will be full within a day at the rate of the last 6 hours"
      description: >-
        Instance **{{ $labels.instance }}**,
        {{ with printf "node_filesystem_avail_bytes{instance='%s',mountpoint='/'}" .Labels.instance | query }}{{ . | first | value | humanize1024 }}{{ end }}B free

  - alert: CriticalDiskUsage
    expr: node_filesystem_avail_bytes{mountpoint="/", load="continuous"} / node_filesystem_size_bytes < 0.10
    for: 10m
    labels:
      severity: critical
    annotations:
      summary: "Root disk has had less than 10% free for more than 10 minutes"
      description: >-
        Instance **{{ $labels.instance }}**,
        {{ with printf "node_filesystem_avail_bytes{instance='%s',mountpoint='/'}" .Labels.instance | query }}{{ . | first | value | humanize1024 }}{{ end }}B free

  - alert: CriticalCPULoad
    expr: >-
      (1 - avg by (instance, target, load) (rate(node_cpu_seconds_total{mode="idle", load="continuous"}[5m])))
      * 100 > 96
    for: 10m
    labels:
      severity: critical
    annotations:
      summary: "CPU load average has been above 96% for more than 10 minutes"
      description: "Instance **{{ $labels.instance }}**"

  - alert: AsteriskTotalCalls
    # Allow 10m without call
    expr: increase(asterisk_calls_sum{load="continuous"}[10m]) == 0.0
    labels:
      severity: warning
    annotations:
      summary: "Total calls are not increasing"
      description: "Instance **{{ $labels.instance }}**"

  - alert: AsteriskSimultCalls
    # The expected calls are the mean of a Poisson load: 3 deviations cover its peak
    expr: >-
      asterisk_calls_count{load="continuous"}
      > on(target) group_left()
      (
        max by (target) (k6_expected_calls{load="continuous"})
        + 3 * sqrt(max by (target) (k6_expected_calls{load="continuous"}))
      )
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "Simultaneous calls are higher than the expected peak"
      description: >-
        Instance **{{ $labels.instance }}**,
        Calls {{ $value }}, {{ with printf "max(k6_expected_calls{target='%s'})" .Labels.target | query }}{{ . | first | value | printf "%.0f" }}{{ end }} expected on average

  - alert: PGConnectionUsage
    expr: sum by (instance, target, load) (pg_stat_activity_count{load="continuous"}) / sum by (instance, target, load) (pg_settings_max_connections{load="continuous"}) * 100 > 90
    for: 10m
    labels:
      severity: critical
    annotations:
      summary: "PostgreSQL connections usage has been above 90% for more than 10 minutes"
      description: "Instance **{{ $labels.instance }}**"

  - alert: FileDescriptorsUsage
    expr: namedprocess_namegroup_worst_fd_ratio{load="continuous"} > 0.9
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "File descriptors usage has been above 90% for more than 5 minutes"
      description: "Instance **{{ $labels.instance }}**, Service {{ $labels.groupname }}, {{ $value | humanizePercentage }}"

  - alert: CallsNotAnswered
    expr: >-
      sum by (testid, target, load) (rate(k6_sip_calls_total{answered="false", load="continuous"}[10m]))
      / sum by (testid, target, load) (rate(k6_sip_calls_total{load="continuous"}[10m]))
      > 0.05
    for: 10m
    labels:
      severity: critical
    annotations:
      summary: "More than 5% of calls have not been answered for more than 10 minutes"
      description: "Run **{{ $labels.testid }}**, {{ $value | humanizePercentage }} not answered"

  - alert: TargetDown
    expr: up{load="continuous"} == 0
    for: 15m
    labels:
      severity: critical
    annotations:
      summary: "Target has not been scraped for more than 15 minutes"
      description: "Instance **{{ $labels.instance }}**, Job {{ $labels.job }}"

  - alert: LoadNotRunning
    # Stopping a continuous load silences its target: this catches a crashed one
    expr: >-
      count by (target, load) (up{load="continuous"})
      unless on(target)
      k6_expected_calls{load="continuous"}
    for: 10m
    labels:
      severity: critical
    annotations:
      summary: "Continuous load has not been running for more than 10 minutes"
      description: "Target **{{ $labels.target }}**"
